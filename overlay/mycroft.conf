{
  "log_level": "INFO",
  "play_wav_cmdline": "mpv --no-video --no-terminal --really-quiet %1",
  "play_mp3_cmdline": "mpv --no-video --no-terminal --really-quiet %1",
  "lang": "en-us",
  "system_unit": "metric",
  "temperature_unit": "celsius",
  "precipitation_unit": "mm",
  "windspeed_unit": "kph",
  "time_format": "full",
  "spoken_time_format": "full",
  "date_format": "DMY",
  "location": {
    "timezone": {
      "code": "America/Toronto",
      "name": "America/Toronto"
    }
  },
  "listener": {
    "VAD": {
      "module": "ovos-vad-plugin-silero",
      "ovos-vad-plugin-silero": {
        "silence_duration": 0.5
      }
    },
    "microphone": {
      "module": "ovos-microphone-plugin-sounddevice",
      "ovos-microphone-plugin-sounddevice": {
        "device": "default",
        "latency": "high",
        "blocksize": 2048,
        "queue_maxsize": 32,
        "auto_sample_rate_fallback": true,
        "auto_channel_fallback": true,
        "auto_latency_fallback": true
      }
    },
    "wake_word": "hey_mycroft",
    "vad_pre_wake_enabled": true,
    "multiplier": 1.5,
    "patience": 0.5,
    "utterance_chunks_to_rewind": 0,
    "silence_end": 1.5
  },
  "hotwords": {
    "hey_mycroft": {
      "module": "ovos-ww-plugin-precise-onnx",
      "sensitivity": 0.55,
      "trigger_level": 3,
      "listen": true,
      "active": true
    }
  },
  "skills": {
    "installer": {
      "allow_pip": false,
      "allow_alphas": false
    }
  },
  "gui": {
    "idle_display_skill": "ovos-skill-homescreen.openvoiceos"
  },
  "Audio": {
    "backends": {
      "OCP": {
        "playback_mode": 40
      }
    }
  },
  "intents": {
    "pipeline": [
      "ovos-stop-pipeline-plugin-high",
      "ovos-converse-pipeline-plugin",
      "ovos-ocp-pipeline-plugin-high",
      "ovos-persona-pipeline-plugin-high",
      "ovos-padatious-pipeline-plugin-high",
      "ovos-fallback-pipeline-plugin-high",
      "ovos-adapt-pipeline-plugin-high",
      "ovos-stop-pipeline-plugin-medium",
      "ovos-adapt-pipeline-plugin-medium",
      "ovos-common-query-pipeline-plugin",
      "ovos-fallback-pipeline-plugin-medium",
      "ovos-persona-pipeline-plugin-low",
      "ovos-fallback-pipeline-plugin-low"
    ],
    "OCP": {
      "legacy": true
    }
  },
  "websocket": {
    "host": "127.0.0.1",
    "max_msg_size": 25
  },
  "network_tests": {
    "ip_url": "https://ifconfig.me/ip"
  },
  "PHAL": {
    "admin": {
      "ovos-PHAL-plugin-system": {
        "enabled": true
      }
    },
    "ovos-PHAL-plugin-hotkeys": {
      "key_down": {
        "mycroft.mic.listen": 582,
        "mycroft.mic.mute": 248,
        "mycroft.volume.increase": 115,
        "mycroft.volume.decrease": 114
      },
      "key_up": {
        "mycroft.mic.unmute": 248
      }
    },
    "ovos-phal-plugin-ipgeo": {
      "enabled": true
    }
  },
  "open_data": {
    "intent_urls": [
      "https://metrics.tigregotico.pt/intents"
    ]
  },
  "tts": {
    "module": "ovos-tts-plugin-piper",
    "ovos-tts-plugin-piper": {
      "voice": "alan-low"
    }
  },
  "stt": {
    "module": "ovos-stt-plugin-vosk",
    "ovos-stt-plugin-vosk": {
      "model": "/home/clinton/.local/share/vosk/vosk-model-small-en-us-0.15"
    }
  }
}
